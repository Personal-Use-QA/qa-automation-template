name: Automation Exercise regression unit
on:
  workflow_call:
    inputs:
      run_label:
        description: Unique report label within the caller workflow
        required: true
        type: string
      publish_report:
        description: Prepare the public Pages artifact
        default: false
        type: boolean
    outputs:
      pages_ready:
        description: Whether a public summary was generated
        value: ${{ jobs.regression.outputs.pages_ready }}
permissions:
  contents: read
env:
  # Each UI screen is listed once; lanes:check verifies this contract.
  AE_UI_UNITS: 'catalog,cart,home,account,contact,checkout'
  AE_SAFE_GREP: '^(?!.*@journey)(?!.*@logout-revokes)(?!.*@sqli)(?!.*@xss)'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      pages_ready: ${{ steps.public_report.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run tags:check -- --config=playwright.automationexercise.config.ts
      - run: npm run lanes:check
      - run: npm run findings:check
      - name: Check Controls changes against the previous revision
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_revision=$(git rev-parse HEAD^)
          else
            base_revision=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          npm run docs:check -- "$base_revision"
      - run: node --test scripts/automationexercise-report.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Record expected guest cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results/automationexercise-discovery.json
        run: npx playwright test --config=playwright.automationexercise.config.ts --project=ae-chromium --project=ae-api --grep "$AE_SAFE_GREP" --list --reporter=json
      - name: Run guest regression
        timeout-minutes: 30
        run: npx playwright test --config=playwright.automationexercise.config.ts --project=ae-chromium --project=ae-api --grep "$AE_SAFE_GREP" --retries=0 --global-timeout=1500000
      - name: Reject missing, skipped, flaky or failed cases
        if: ${{ !cancelled() }}
        run: node scripts/automationexercise-report.mjs --check
      - name: Build public results summary
        id: public_report
        if: ${{ !cancelled() }}
        run: |
          node scripts/automationexercise-report.mjs --publish
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Preserve full evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automationexercise-${{ inputs.run_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            playwright-report/automationexercise/
            results/automationexercise*.json
            test-results/automationexercise/
      - name: Upload public summary
        if: ${{ !cancelled() && inputs.publish_report && steps.public_report.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/automationexercise
