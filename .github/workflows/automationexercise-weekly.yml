name: Automation Exercise weekly regression
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automationexercise-regression
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repetition: [1, 2, 3]
    uses: ./.github/workflows/_automationexercise-regression.yml
    with:
      run_label: weekly-${{ matrix.repetition }}
      publish_report: false
