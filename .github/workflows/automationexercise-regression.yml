name: Automation Exercise daily regression
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      include_journeys:
        description: Also run disposable account, order and contact journeys
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: automationexercise-regression
  cancel-in-progress: false
jobs:
  regression:
    uses: ./.github/workflows/_automationexercise-regression.yml
    with:
      run_label: daily
      publish_report: true
  pages:
    needs: regression
    if: ${{ !cancelled() && needs.regression.outputs.pages_ready == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish latest results
        id: deployment
        uses: actions/deploy-pages@v4
  journeys:
    needs: regression
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.include_journeys }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      AE_ALLOW_JOURNEYS: '1'
      PLAYWRIGHT_JSON_OUTPUT_NAME: results/automationexercise-journeys.json
      PLAYWRIGHT_OUTPUT_DIR: test-results/automationexercise-journeys
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/automationexercise-journeys
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run explicitly requested journeys
        timeout-minutes: 55
        run: npx playwright test --config=playwright.automationexercise.config.ts --project=ae-chromium --project=ae-api --grep '^.*@(journey|logout-revokes)' --retries=0 --global-timeout=3000000
      - name: Preserve journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automationexercise-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            playwright-report/automationexercise-journeys/
            results/automationexercise-journeys.json
            test-results/automationexercise-journeys/
